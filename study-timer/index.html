<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Study Mosaic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Martian+Mono:wdth,wght@75..112.5,300..700&display=swap">
<style>
  /* Layout: a full-bleed canvas fills with squares behind a centred time plate.
     Brand + mode sit along the top, subjects + settings in a glass dock at the bottom.
     Full screen drops everything except the squares and an enlarged plate. */
  :root {
    --ink: #0c0d12;
    --glass: rgba(15, 16, 23, 0.8);
    --line: rgba(232, 234, 245, 0.1);
    --line-strong: rgba(232, 234, 245, 0.22);
    --text: #eceef6;
    --muted: #9599ad;
    --danger: #ff7a85;
    --subj: hsl(357, 78%, 61%);
    --subj-soft: hsla(357, 78%, 61%, 0.1);
    --subj-line: hsla(357, 78%, 61%, 0.35);
    --plate: hsla(357, 30%, 8%, 0.8);
    --on-subj: #0c0d12;
    --font-ui: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-num: "Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1100px 680px at 50% 45%, var(--subj-soft), transparent 70%), var(--ink);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.4;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }

  #tiles { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

  .app {
    position: relative;
    z-index: 1;
    box-sizing: border-box;
    height: 100%;
    overflow-y: auto;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 16px;
    padding-block: 16px;
    padding-inline: 16px;
  }

  /* Top bar */
  .topbar { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .brand {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 11px 14px; border-radius: 12px;
    background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    font: 600 12px/1 var(--font-num); letter-spacing: 0.16em; text-transform: uppercase;
  }
  .mark { display: grid; grid-template-columns: repeat(2, 6px); gap: 2px; }
  .mark i { width: 6px; height: 6px; border-radius: 1.5px; background: var(--line-strong); }
  .mark i:nth-child(1), .mark i:nth-child(4) { background: var(--subj); }
  .mode-wrap { position: relative; }
  .confirm {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 5;
    width: min(340px, calc(100vw - 32px)); box-sizing: border-box;
    display: grid; gap: 10px; padding: 14px;
    border-radius: 14px; background: var(--glass); border: 1px solid var(--line-strong);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    font-size: 14px;
  }
  .confirm-actions { display: flex; gap: 8px; }

  /* Segmented controls */
  .seg {
    display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px;
    background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .seg button {
    border: 0; background: transparent; color: var(--muted);
    font: 600 13px/1 var(--font-ui); padding: 10px 15px; border-radius: 9px; cursor: pointer;
  }
  .seg button:hover:not(:disabled) { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--ink); }
  .seg-small { background: rgba(255, 255, 255, 0.03); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .seg-small button { padding: 8px 11px; font-size: 12.5px; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font: 600 14px/1 var(--font-ui); padding: 12px 18px; border-radius: 12px;
    border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); color: var(--text);
    cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: 0.38; cursor: not-allowed; }
  .btn-primary { min-width: 132px; background: var(--subj); border-color: transparent; color: var(--on-subj); }
  .btn-primary:hover:not(:disabled) { background: var(--subj); filter: brightness(1.08); }
  .btn-small { padding: 8px 12px; font-size: 13px; border-radius: 9px; }
  .btn.armed { border-color: var(--danger); color: var(--danger); }
  :focus-visible { outline: 2px solid var(--subj); outline-offset: 2px; }

  /* Time plate */
  .stage { display: grid; place-items: center; min-height: 0; }
  .plate {
    display: grid; justify-items: center; gap: 14px;
    max-width: 100%; box-sizing: border-box;
    padding: 22px clamp(18px, 4vw, 34px) 24px;
    border-radius: 24px;
    background: var(--plate);
    border: 1px solid var(--subj-line);
    -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
    box-shadow: 0 30px 90px -30px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  .plate-head {
    display: flex; align-items: center; gap: 10px;
    font: 600 12px/1 var(--font-num); letter-spacing: 0.16em; text-transform: uppercase;
  }
  .dot { width: 0.85em; height: 0.85em; border-radius: 0.25em; background: var(--subj); box-shadow: 0 0 14px var(--subj); }
  .status {
    color: var(--muted); padding: 0.45em 0.7em; border: 1px solid var(--line); border-radius: 0.5em;
    font-size: 0.82em; letter-spacing: 0.14em;
  }
  .digits {
    font-family: var(--font-num); font-weight: 500; font-stretch: 87.5%;
    font-variant-numeric: tabular-nums; font-size: clamp(48px, 10vw, 124px);
    line-height: 1; letter-spacing: -0.03em; white-space: nowrap;
  }
  .digits .c { color: var(--muted); opacity: 0.75; }
  .meter { width: 100%; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0%; background: var(--subj); }
  .meta { font: 400 12px/1.4 var(--font-num); color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

  /* Dock */
  .dock {
    justify-self: center; width: 100%; max-width: 1060px; box-sizing: border-box;
    display: grid; gap: 14px; padding: 14px; border-radius: 20px;
    background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(16px) saturate(1.1); backdrop-filter: blur(16px) saturate(1.1);
  }
  .subjects { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .subject {
    --c: #888;
    display: flex; align-items: center; gap: 10px; min-width: 0;
    padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); color: var(--text);
    cursor: pointer; text-align: left; transition: border-color 0.15s, background 0.15s;
  }
  .subject:hover { background: rgba(255, 255, 255, 0.07); }
  .subject .sw { flex: none; width: 16px; height: 16px; border-radius: 4px; background: var(--c); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3); }
  .subject .txt { display: grid; gap: 5px; min-width: 0; }
  .subject .name { font-weight: 600; font-size: 14px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .subject .today { font: 400 11px/1 var(--font-num); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .subject[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .subject[aria-pressed="true"] .sw { box-shadow: 0 0 12px var(--c), inset 0 1px 0 rgba(255, 255, 255, 0.3); }

  .settings { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; }
  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; min-width: 0; }
  .label { font: 600 10.5px/1 var(--font-num); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: 500 12px/1 var(--font-num); padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer;
  }
  .chip:hover:not(:disabled) { border-color: var(--line-strong); }
  .chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--ink); }
  .chip:disabled, .seg button:disabled, .custom input:disabled { opacity: 0.4; cursor: not-allowed; }
  .custom { display: inline-flex; align-items: center; gap: 4px; font: 500 12px/1 var(--font-num); color: var(--muted); }
  .custom input {
    width: 3.2em; padding: 7px 4px; border-radius: 8px; border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.04); color: var(--text);
    font: 500 13px/1 var(--font-num); text-align: center;
  }
  .note { font-size: 12px; color: var(--muted); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
  .toggle input { accent-color: var(--subj); width: 16px; height: 16px; margin: 0; }
  .keys { margin: 0; font: 400 11px/1.4 var(--font-num); color: var(--muted); letter-spacing: 0.03em; }
  .keys kbd { font: inherit; color: var(--text); padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; }

  @media (max-width: 760px) {
    .subjects { display: flex; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 4px; }
    .subject { flex: 0 0 auto; min-width: 140px; scroll-snap-align: start; }
    .settings { gap: 12px 18px; }
  }
  @media (hover: none) { .keys { display: none; } }

  /* Full screen (focus) mode */
  body.focus .topbar, body.focus .dock, body.focus .actions, body.focus .meta { display: none; }
  body.focus .app { grid-template-rows: 1fr; }
  body.focus .plate {
    gap: clamp(12px, 2.2vh, 26px);
    padding: clamp(18px, 3.6vh, 46px) clamp(24px, 4.5vw, 76px);
    border-radius: clamp(20px, 2.4vw, 38px);
  }
  body.focus .plate-head { font-size: clamp(12px, 1.3vw, 19px); }
  body.focus .digits { font-size: min(17vw, 30vh); }
  body.focus.idle, body.focus.idle * { cursor: none; }
  .focus-ui {
    position: fixed; z-index: 10;
    top: calc(env(safe-area-inset-top, 0px) + 16px); right: 16px; left: 16px;
    display: none; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px;
    pointer-events: none; opacity: 0; transition: opacity 0.3s;
  }
  .focus-ui .hint { font: 400 12px/1 var(--font-num); color: var(--muted); margin-right: 6px; }
  .focus-ui .btn { background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  body.focus .focus-ui { display: flex; }
  body.focus.show-ui .focus-ui { opacity: 1; pointer-events: auto; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>

<canvas id="tiles" aria-hidden="true"></canvas>

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Study Mosaic</div>
    <div class="mode-wrap">
      <div class="seg" role="group" aria-label="Mode">
        <button type="button" id="mode-timer" data-mode="timer">Timer</button>
        <button type="button" id="mode-stopwatch" data-mode="stopwatch">Stopwatch</button>
      </div>
      <div class="confirm" id="mode-confirm" role="alertdialog" aria-labelledby="mode-confirm-text" hidden>
        <span id="mode-confirm-text">Switch modes? This resets the current session.</span>
        <div class="confirm-actions">
          <button type="button" class="btn btn-small armed" id="mode-confirm-yes">Switch and reset</button>
          <button type="button" class="btn btn-small" id="mode-confirm-no">Keep going</button>
        </div>
      </div>
    </div>
  </header>

  <main class="stage">
    <section class="plate" aria-label="Study clock">
      <div class="plate-head"><span class="dot" aria-hidden="true"></span><span id="plate-subject">Maths</span><span class="status" id="status">Ready</span></div>
      <div class="digits" id="digits" role="timer" aria-live="off">1:00:00</div>
      <div class="meter" aria-hidden="true"><i id="meter"></i></div>
      <div class="meta" id="meta">&nbsp;</div>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="start">Start</button>
        <button type="button" class="btn" id="reset">Reset</button>
        <button type="button" class="btn" id="fullscreen">Full screen</button>
      </div>
    </section>
  </main>

  <section class="dock" aria-label="Session settings">
    <div class="subjects" id="subjects" role="group" aria-label="Subject"></div>
    <div class="settings">
      <div class="group">
        <span class="label" id="duration-label">Duration</span>
        <div class="chips" id="presets"></div>
        <div class="custom">
          <input id="dur-h" type="number" min="0" max="23" inputmode="numeric" aria-label="Hours"><span>h</span>
          <input id="dur-m" type="number" min="0" max="59" inputmode="numeric" aria-label="Minutes"><span>m</span>
        </div>
        <span class="note" id="duration-note" hidden>Reset to change</span>
      </div>
      <div class="group">
        <span class="label">Fill</span>
        <div class="seg seg-small" id="patterns" role="group" aria-label="Fill pattern"></div>
        <button type="button" class="btn btn-small" id="preview">Preview</button>
      </div>
      <div class="group">
        <span class="label">Squares</span>
        <div class="seg seg-small" id="sizes" role="group" aria-label="Square size"></div>
      </div>
      <label class="toggle" for="sound"><input type="checkbox" id="sound"><span>Chime when done</span></label>
    </div>
    <p class="keys"><kbd>Space</kbd> start / pause &nbsp;·&nbsp; <kbd>F</kbd> full screen &nbsp;·&nbsp; <kbd>Esc</kbd> exit full screen</p>
  </section>
</div>

<div class="focus-ui" id="focus-ui">
  <span class="hint">Esc or double-click to exit</span>
  <button type="button" class="btn btn-small" id="focus-run">Pause</button>
  <button type="button" class="btn btn-small" id="focus-exit">Exit full screen</button>
</div>

<script>
(() => {
  'use strict';

  const SUBJECTS = [
    { id: 'business',    name: 'Business',    h: 266, s: 80, l: 67 },
    { id: 'economics',   name: 'Economics',   h: 148, s: 55, l: 48 },
    { id: 'maths',       name: 'Maths',       h: 357, s: 78, l: 61 },
    { id: 'cs',          name: 'CS',          h: 214, s: 88, l: 61 },
    { id: 'programming', name: 'Programming', h: 46,  s: 95, l: 55 },
  ];
  const SUB = Object.fromEntries(SUBJECTS.map((s) => [s.id, s]));
  const PRESETS = [[15, '15m'], [25, '25m'], [45, '45m'], [60, '1h'], [90, '1h 30m'], [120, '2h']];
  const PATTERNS = [['scatter', 'Scatter'], ['rise', 'Rise'], ['sweep', 'Sweep'], ['bloom', 'Bloom']];
  const SIZES = [['S', 'Small', 30], ['M', 'Medium', 46], ['L', 'Large', 74]];
  const SHADES = [-9, -5, -2, 1, 4, 8];          // lightness offsets that give the mosaic its texture
  const STORE = 'study-mosaic:v1';
  const PREVIEW_MS = 9000, SHIMMER_MS = 2200, FADE_MS = 1400;
  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const hsl = (h, s, l, a = 1) => `hsla(${h.toFixed(1)}, ${s}%, ${l}%, ${a})`;
  const newSeed = () => (Math.random() * 4294967296) >>> 0;
  const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- State ----------
  function defaults() {
    return {
      mode: 'timer', subject: 'maths', durationMin: 60, pattern: 'scatter', size: 'M', sound: true,
      running: false, acc: 0, runStart: 0, done: false, seed: newSeed(),
      segments: [{ at: 0, subject: 'maths' }],
      tally: { date: todayKey(), ms: {} }, tallyMark: 0,
    };
  }
  function loadState() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE)); } catch (_) { saved = null; }
    if (!saved || typeof saved !== 'object') return { s: defaults(), fresh: true };
    const s = Object.assign(defaults(), saved);
    if (!SUB[s.subject]) s.subject = 'maths';
    if (s.mode !== 'timer' && s.mode !== 'stopwatch') s.mode = 'timer';
    s.durationMin = clamp(Math.round(+s.durationMin) || 60, 1, 1439);
    if (!PATTERNS.some((p) => p[0] === s.pattern)) s.pattern = 'scatter';
    if (!SIZES.some((z) => z[0] === s.size)) s.size = 'M';
    s.sound = s.sound !== false;
    s.acc = Math.max(0, +s.acc || 0);
    s.runStart = +s.runStart || 0;
    s.running = !!s.running && s.runStart > 0;
    s.done = !!s.done;
    s.seed = (+s.seed >>> 0) || newSeed();
    if (!Array.isArray(s.segments) || !s.segments.length ||
        s.segments.some((g) => !g || !SUB[g.subject] || !(g.at >= 0))) {
      s.segments = [{ at: 0, subject: s.subject }];
    }
    if (!s.tally || typeof s.tally !== 'object' || !s.tally.ms || typeof s.tally.ms !== 'object') {
      s.tally = { date: todayKey(), ms: {} };
    }
    s.tallyMark = Math.max(0, +s.tallyMark || 0);
    return { s, fresh: false };
  }
  const loaded = loadState();
  const state = loaded.s;
  function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (_) { /* storage unavailable */ } }

  const T = () => state.durationMin * 60000;
  function elapsed(now = Date.now()) {
    let e = state.acc + (state.running ? Math.max(0, now - state.runStart) : 0);
    if (state.mode === 'timer') e = Math.min(e, T());
    return e;
  }
  // Adds study time since the last call to today's total for the current subject.
  function account() {
    const d = todayKey();
    if (state.tally.date !== d) state.tally = { date: d, ms: {} };
    const e = elapsed();
    const delta = e - state.tallyMark;
    if (delta > 0) state.tally.ms[state.subject] = (state.tally.ms[state.subject] || 0) + delta;
    state.tallyMark = e;
  }
  function subjectAt(t) {
    const segs = state.segments;
    let id = segs[0].subject;
    for (let i = 1; i < segs.length; i++) { if (segs[i].at <= t) id = segs[i].subject; else break; }
    return id;
  }

  // ---------- Canvas ----------
  const canvas = $('tiles');
  const ctx = canvas.getContext('2d');
  const staticCanvas = document.createElement('canvas');
  const sctx = staticCanvas.getContext('2d');
  let prevCanvas = null;
  let grid = { N: 0 };
  let sprites = {}, ghost = null, white = null;
  const drawn = { valid: false, cycle: 0, completed: 0, preview: false };
  const fx = { preview: null, shimmer: null, fade: null };
  let paintRequested = true;

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function makeTile(t, top, bottom, gloss, stroke) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = t;
    const g = cv.getContext('2d');
    const r = t * 0.2;
    roundRect(g, 0, 0, t, t, r);
    const fill = g.createLinearGradient(0, 0, 0, t);
    fill.addColorStop(0, top);
    fill.addColorStop(1, bottom);
    g.fillStyle = fill;
    g.fill();
    const lw = Math.max(1, t * 0.035);
    if (gloss || stroke) {
      roundRect(g, lw / 2, lw / 2, t - lw, t - lw, Math.max(0, r - lw / 2));
      if (gloss) {
        const edge = g.createLinearGradient(0, 0, 0, t);
        edge.addColorStop(0, 'rgba(255,255,255,0.38)');
        edge.addColorStop(0.45, 'rgba(255,255,255,0)');
        edge.addColorStop(1, 'rgba(0,0,0,0.14)');
        g.strokeStyle = edge;
      } else {
        g.strokeStyle = stroke;
      }
      g.lineWidth = lw;
      g.stroke();
    }
    return cv;
  }
  function buildSprites() {
    const t = grid.tile;
    sprites = {};
    for (const s of SUBJECTS) {
      sprites[s.id] = SHADES.map((dl, i) => {
        const h = s.h + (i - (SHADES.length - 1) / 2) * 1.8;
        const l = s.l + dl;
        return makeTile(t, hsl(h, s.s, Math.min(86, l + 7)), hsl(h, Math.min(100, s.s + 6), Math.max(14, l - 6)), true);
      });
    }
    ghost = makeTile(t, 'rgba(255,255,255,0.04)', 'rgba(255,255,255,0.02)', false, 'rgba(255,255,255,0.05)');
    white = makeTile(t, '#ffffff', '#ffffff', false);
  }
  function computeOrder(cols, rows) {

    if (!grid.N) { relayout(); if (!grid.N) return; }
    const now = Date.now();
    tick();
    const v = currentView(now);
    syncStatic(v);
    if (paintRequested || state.running || v.preview || fx.shimmer || fx.fade) {
      render(v, now);
      paintRequested = false;
    }
    updateText(v);
  }

  // ---------- Boot ----------
  applyTheme();
  relayout();
  if (state.mode === 'timer' && state.running && elapsed() >= T()) finish(true);
  if (state.running) requestWake();
  syncUI();
  requestAnimationFrame(frame);
  if (loaded.fresh) {
    save();
    if (!reduceMotion) setTimeout(startPreview, 700);
  }
})();
</script>
</body>
</html>
